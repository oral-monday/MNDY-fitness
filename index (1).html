function MondayFit() {
  const [lang, setLang] = useState(null);
  const [tab, setTab] = useState("onboard");
  const [form, setForm] = useState({ name: "", gender: "", age: "", weight: "", height: "", goal: "", level: "", duration: "1", days: "4" });
  const [completed, setCompleted] = useState({});
  const [myPts, setMyPts] = useState(1340);
  const [selectedWeek, setSelectedWeek] = useState(1);
  const [generating, setGenerating] = useState(false);
  const [planReady, setPlanReady] = useState(false);
  const [showNutrition, setShowNutrition] = useState(false);
  const [altShown, setAltShown] = useState({});
  const [aiText, setAiText] = useState("");

  const tr = (key) => T[lang || "en"][key];
  const isHe = lang === "he";

  const getGoalKey = (g) => {
    if (!g) return "maintain";
    if (g.includes("Lose") || g.includes("ירידה")) return "cut";
    if (g.includes("Bulk") || g.includes("Build") || g.includes("מסה") || g.includes("שריר")) return "bulk";
    return "maintain";
  };

  const countCompleted = () => Object.values(completed).filter(Boolean).length;
  const getTotalDays = () => parseInt(form.duration) * 7;
  const getMyRank = () => EMPLOYEES.filter((e) => e.pts > myPts).length + 1;
  const calcProgress = () => {
    const fields = [form.name, form.gender, form.age, form.weight, form.height, form.goal, form.level, form.duration, form.days];
    return Math.round((fields.filter(Boolean).length / fields.length) * 100);
  };
  const isFormComplete = () => form.name && form.gender && form.age && form.weight && form.height && form.goal && form.level && form.duration && form.days;

  const updateForm = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const markComplete = (key) => {
    setCompleted((c) => {
      const next = { ...c };
      if (!next[key]) { next[key] = true; setMyPts((p) => p + 120); }
      else { next[key] = false; setMyPts((p) => Math.max(0, p - 120)); }
      return next;
    });
  };

  const toggleAlt = (idx) => setAltShown((a) => ({ ...a, [idx]: !a[idx] }));

  const resetPlan = () => { setPlanReady(false); setCompleted({}); setMyPts(1340); setAltShown({}); setAiText(""); };

  const generatePlan = async () => {
    if (!isFormComplete()) return;
    setGenerating(true);
    setAiText("");
    const bmi = (parseFloat(form.weight) / Math.pow(parseFloat(form.height) / 100, 2)).toFixed(1);
    const prompt = isHe
      ? `אתה מאמן כושר ותזונאי מקצועי. צור סיכום קצר ומעודד לתוכנית כושר של ${form.duration} שבועות עבור:\n- שם: ${form.name}, ${form.gender}, גיל ${form.age}\n- ${form.weight} ק"ג, ${form.height} ס"מ (BMI: ${bmi})\n- מטרה: ${form.goal}\n- רמה: ${form.level}\n- ${form.days} ימי אימון בשבוע\n\nכתוב 3-4 פסקאות קצרות בעברית:\n1. הערכה אישית (BMI ומה זה אומר עבור המטרה)\n2. סקירת התוכנית ומה לצפות\n3. תחומי מיקוד וטיפים להצלחה\n4. סיום מוטיבציה\n\nשמור על טון חם, ישיר, עד 200 מילים. ללא נקודות.`
      : `You are a fitness expert. Create a brief encouraging ${form.duration}-week program summary for:\n- Name: ${form.name}, ${form.gender}, age ${form.age}\n- ${form.weight}kg, ${form.height}cm (BMI: ${bmi})\n- Goal: ${form.goal}, Level: ${form.level}, ${form.days} days/week\n\nWrite 3-4 short paragraphs: personal assessment, program overview, key tips, motivational close. Under 200 words, no bullets.`;

    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, stream: true, messages: [{ role: "user", content: prompt }] }),
      });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let txt = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        for (const line of dec.decode(value).split("\n").filter((l) => l.startsWith("data:"))) {
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            const j = JSON.parse(data);
            if (j.type === "content_block_delta" && j.delta?.text) { txt += j.delta.text; setAiText(txt); }
          } catch (_) {}
        }
      }
      await new Promise((r) => setTimeout(r, 400));
      setGenerating(false);
      setPlanReady(true);
    } catch (_) {
      setGenerating(false);
      setPlanReady(true);
    }
  };

  if (!lang) {
    return (
      <>
        <style>{styles}</style>
        <div className="mf-app">
          <div className="mf-inner">
            <div className="mf-lang-screen">
              <div className="mf-lang-logo">
                <img src={LOGO_B64} alt="monday.com logo" />
                <div className="mf-lang-logo-text">monday <span>Fitness</span></div>
              </div>
              <div>
                <div className="mf-lang-title" style={{ marginBottom: 8 }}>Choose your language / בחר שפה</div>
                <div className="mf-lang-sub">Select to get started</div>
              </div>
              <div className="mf-lang-options">
                <button className="mf-lang-btn" onClick={() => setLang("en")}><span className="mf-lang-flag">🇬🇧</span><span className="mf-lang-name">English</span></button>
                <button className="mf-lang-btn" onClick={() => setLang("he")}><span className="mf-lang-flag">🇮🇱</span><span className="mf-lang-name">עברית</span></button>
              </div>
            </div>
          </div>
        </div>
      </>
    );
  }

  const dur = parseInt(form.duration);
  const gk = getGoalKey(form.goal);
  const nut = NUTRITION[gk];
  const dayPlan = WORKOUT_PLANS[dur] || WORKOUT_PLANS[1];
  const weeks = Array.from({ length: dur }, (_, i) => i + 1);
  const totalDays = getTotalDays();
  const done = countCompleted();
  const pct = Math.round((done / totalDays) * 100);
  const bmi = form.weight && form.height ? (parseFloat(form.weight) / Math.pow(parseFloat(form.height) / 100, 2)).toFixed(1) : "—";
  const myRank = getMyRank();
  const rankStr = tr("rankOf").replace("%r", myRank).replace("%t", EMPLOYEES.length + 1);
  const mealIcons = ["🌅", "☀️", "🥤", "🌙", "🌙"];

  const all = [...EMPLOYEES, { name: form.name || "You", dept: "monday.com", pts: myPts, days: done, av: 2, isMe: true }].sort((a, b) => b.pts - a.pts);
  const maxPts = all[0].pts;
  const cl = tr("challengeList");
  const earned = cl.filter((c) => c.done).reduce((a, c) => a + c.pts, 0);

  return (
    <>
      <style>{styles}</style>
      <div className="mf-app" dir={isHe ? "rtl" : "ltr"}>
        <div className="mf-inner">
          <div className="mf-header">
            <div className="mf-logo">
              <img src={LOGO_B64} alt="monday.com logo" />
              <div>
                <div className="mf-logo-text">monday <span>Fitness</span></div>
                <div className="mf-header-sub">{tr("appSub")}</div>
              </div>
            </div>
            <button className="mf-lang-btn" onClick={() => setLang(null)}>{tr("switchLang")}</button>
          </div>

          <div className="mf-tabs">
            {tr("tabs").map((tb, i) => (
              <button key={i} className={`mf-tab${tab === ["onboard", "leaderboard", "challenges"][i] ? " active" : ""}`} onClick={() => setTab(["onboard", "leaderboard", "challenges"][i])}>{tb}</button>
            ))}
          </div>

          {tab === "onboard" && (
            <>
              {!generating && !planReady && (
                <>
                  <div className="mf-section-title">{tr("buildProgram")}</div>
                  <div className="mf-section-sub">{tr("buildSub")}</div>
                  <div className="mf-progress-bar"><div className="mf-progress-fill" style={{ width: `${calcProgress()}%` }} /></div>

                  {[
                    { step: 0, q: tr("nameQ"), children: <input className="mf-q-input" placeholder={tr("namePh")} value={form.name} onChange={(e) => updateForm("name", e.target.value)} /> },
                    { step: 1, q: tr("genderQ"), children: <div className="mf-q-options">{tr("genderOpts").map((o) => <button key={o} className={`mf-q-opt${form.gender === o ? " selected" : ""}`} onClick={() => updateForm("gender", o)}>{o}</button>)}</div> },
                    {
                      step: 2, q: tr("statsQ"), children: (
                        <>
                          <div className="mf-q-row">
                            <div><div className="mf-sub-label">{tr("ageLbl")}</div><input className="mf-q-input" type="number" placeholder={tr("agePh")} value={form.age} onChange={(e) => updateForm("age", e.target.value)} /></div>
                            <div><div className="mf-sub-label">{tr("weightLbl")}</div><input className="mf-q-input" type="number" placeholder={tr("weightPh")} value={form.weight} onChange={(e) => updateForm("weight", e.target.value)} /></div>
                          </div>
                          <div className="mf-q-row" style={{ marginTop: 10 }}>
                            <div><div className="mf-sub-label">{tr("heightLbl")}</div><input className="mf-q-input" type="number" placeholder={tr("heightPh")} value={form.height} onChange={(e) => updateForm("height", e.target.value)} /></div>
                            <div />
                          </div>
                        </>
                      )
                    },
                    { step: 3, q: tr("goalQ"), children: <div className="mf-q-options">{tr("goalOpts").map((o) => <button key={o} className={`mf-q-opt${form.goal === o ? " selected" : ""}`} onClick={() => updateForm("goal", o)}>{o}</button>)}</div> },
                    { step: 4, q: tr("levelQ"), children: <div className="mf-q-options">{tr("levelOpts").map((o) => <button key={o} className={`mf-q-opt${form.level === o ? " selected" : ""}`} onClick={() => updateForm("level", o)}>{o}</button>)}</div> },
                    {
                      step: 5, q: tr("durationQ"), children: (
                        <div className="mf-plan-type-grid">
                          {tr("durationPlans").map((p) => (
                            <div key={p.w} className={`mf-plan-type-card${form.duration === p.w ? " selected" : ""}`} onClick={() => updateForm("duration", p.w)}>
                              <div className="mf-plan-type-weeks">{p.w}W</div>
                              <div className="mf-plan-type-label">{p.label}</div>
                              <div className="mf-plan-type-desc">{p.desc}</div>
                            </div>
                          ))}
                        </div>
                      )
                    },
                    { step: 6, q: tr("daysQ"), children: <div className="mf-q-options">{tr("daysOpts").map((o) => <button key={o} className={`mf-q-opt${form.days === o ? " selected" : ""}`} onClick={() => updateForm("days", o)}>{o} {tr("daysLabel")}</button>)}</div> },
                  ].map(({ step, q, children }) => (
                    <div key={step} className="mf-q-card">
                      <div className="mf-q-label">{step + 1} — {tr("steps")[step]}</div>
                      <div className="mf-q-title">{q}</div>
                      {children}
                    </div>
                  ))}

                  <button className="mf-btn-primary" onClick={generatePlan} disabled={!isFormComplete()}>{tr("generate")}</button>
                </>
              )}

              {generating && (
                <div className="mf-loading">
                  <div className="mf-spinner" />
                  <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 20, fontWeight: 700, marginBottom: 8, color: "#f0ede6" }}>{tr("generating")}</div>
                  <div style={{ color: "#888", fontSize: 14 }}>{tr("genSub")}</div>
                  <div className="mf-ai-stream">{aiText || "..."}</div>
                </div>
              )}

              {planReady && (
                <>
                  <div className="mf-plan-header">
                    <div style={{ fontSize: 13, color: "#888", marginBottom: 4 }}>{tr("hey").replace("%n", form.name || "")}</div>
                    <div className="mf-plan-name">{form.goal}</div>
                    <div className="mf-plan-meta">
                      <span className="mf-plan-badge">{dur}W</span>
                      <span className="mf-plan-badge">{form.days} {tr("daysLabel")}</span>
                      <span className="mf-plan-badge">{form.level}</span>
                      <span className="mf-plan-badge">{tr("bmiLabel")} {bmi}</span>
                    </div>
                    <div style={{ marginTop: 16 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#888", marginBottom: 6 }}>
                        <span>{tr("overallProgress")}</span><span>{done}/{totalDays} — {pct}%</span>
                      </div>
                      <div className="mf-progress-bar" style={{ height: 8 }}><div className="mf-progress-fill" style={{ width: `${pct}%` }} /></div>
                    </div>
                  </div>

                  {aiText && <div className="mf-ai-stream" style={{ marginBottom: 16 }}>{aiText}</div>}

                  <div className="mf-sub-tabs">
                    <button className={`mf-sub-tab${!showNutrition ? " active" : ""}`} onClick={() => setShowNutrition(false)}>🏋️ {tr("workoutTab")}</button>
                    <button className={`mf-sub-tab${showNutrition ? " active" : ""}`} onClick={() => setShowNutrition(true)}>🥗 {tr("nutritionTab")}</button>
                    <button className="mf-redo-btn" onClick={resetPlan}>{tr("redoBtn")}</button>
                  </div>

                  {!showNutrition && (
                    <>
                      {dur > 1 && (
                        <div className="mf-week-tabs">
                          {weeks.map((w) => <button key={w} className={`mf-week-tab${selectedWeek === w ? " active" : ""}`} onClick={() => setSelectedWeek(w)}>Week {w}</button>)}
                        </div>
                      )}
                      <div className="mf-day-grid">
                        {dayPlan.map((d, i) => {
                          const key = `w${selectedWeek}d${i}`;
                          const isDone = completed[key];
                          return (
                            <div key={i} className={`mf-day-card${isDone ? " completed" : ""}`}>
                              <div className="mf-day-label">{isHe ? d.dayHe : d.day}</div>
                              <div className="mf-day-title">{isHe ? d.focusHe : d.focus}</div>
                              <div className="mf-day-items">{d.items.map((it, j) => <div key={j} className="mf-day-item">{it}</div>)}</div>
                              <button className={`mf-complete-btn${isDone ? " done" : ""}`} onClick={() => markComplete(key)}>{isDone ? tr("completed") : tr("markComplete")}</button>
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}

                  {showNutrition && (
                    <>
                      <div className="mf-nutrition-card">
                        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 17, fontWeight: 700, marginBottom: 4, color: "#f0ede6" }}>{tr("dailyTargets")}</div>
                        <div style={{ fontSize: 13, color: "#888" }}>{tr("tailored")} {form.goal}</div>
                        <div className="mf-macro-row">
                          <div className="mf-macro"><div className="mf-macro-val">{nut.cal}</div><div className="mf-macro-label">{tr("calLbl")}</div></div>
                          <div className="mf-macro"><div className="mf-macro-val">{nut.p}g</div><div className="mf-macro-label">{tr("proteinLbl")}</div></div>
                          <div className="mf-macro"><div className="mf-macro-val">{nut.c}g</div><div className="mf-macro-label">{tr("carbsLbl")}</div></div>
                          <div className="mf-macro"><div className="mf-macro-val">{nut.f}g</div><div className="mf-macro-label">{tr("fatLbl")}</div></div>
                        </div>
                      </div>
                      <div style={{ fontSize: 13, color: "#888", marginBottom: 10, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.4px" }}>{tr("mealIdeas")}</div>
                      {nut.meals.map((m, i) => (
                        <div key={i} className="mf-meal-card">
                          <div className="mf-meal-main">
                            <div className="mf-meal-icon">{mealIcons[i]}</div>
                            <div className="mf-meal-info">
                              <div className="mf-meal-time">{tr("mealTimes")[i]}</div>
                              <div className="mf-meal-name">{isHe ? m.he : m.en}</div>
                            </div>
                            <button className={`mf-alt-toggle${altShown[i] ? " showing" : ""}`} onClick={() => toggleAlt(i)}>{altShown[i] ? tr("hideAlt") : tr("altBtn")}</button>
                          </div>
                          {altShown[i] && (
                            <div className="mf-meal-alt">
                              <div className="mf-meal-alt-label">{tr("altLabel")}</div>
                              <div className="mf-meal-alt-name">{isHe ? m.altHe : m.altEn}</div>
                            </div>
                          )}
                        </div>
                      ))}
                    </>
                  )}
                </>
              )}
            </>
          )}

          {tab === "leaderboard" && (
            <>
              <div className="mf-section-title">{tr("leaderboard")}</div>
              <div className="mf-section-sub">{tr("lbSub")}</div>
              <div className="mf-my-score">
                <div>
                  <div className="mf-my-score-pts">{myPts}</div>
                  <div className="mf-my-score-label">{tr("yourScore")} · {rankStr}</div>
                </div>
                <div style={{ marginLeft: "auto", textAlign: isHe ? "left" : "right" }}>
                  <div style={{ fontSize: 13, color: "#888" }}>{done} {tr("daysLabel2")}</div>
                  <div style={{ fontSize: 12, color: "#888", marginTop: 2 }}>{totalDays - done} {tr("remaining")}</div>
                </div>
              </div>
              <div className="mf-lb-card">
                {all.map((e, i) => {
                  const av = AVATARS[e.av % AVATARS.length];
                  const initials = e.name.split(" ").map((n) => n[0]).join("").slice(0, 2);
                  const bar = Math.round((e.pts / maxPts) * 100);
                  return (
                    <div key={i} className="mf-lb-row">
                      <div className={`mf-lb-rank${i < 3 ? " top" : ""}`}>{i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}</div>
                      <div className="mf-lb-avatar" style={{ background: av.bg, color: av.txt }}>{initials}</div>
                      <div className="mf-lb-info">
                        <div className="mf-lb-name">{e.name}{e.isMe ? ` (${isHe ? "אתה" : "you"})` : ""}</div>
                        <div className="mf-lb-detail">{e.dept} · {e.days} {isHe ? "ימים" : "days"}</div>
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                        <div className="mf-lb-score">{e.pts}</div>
                        <div className="mf-lb-bar-wrap"><div className="mf-lb-bar" style={{ width: `${bar}%` }} /></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}

          {tab === "challenges" && (
            <>
              <div className="mf-section-title">{tr("challenges")}</div>
              <div className="mf-section-sub">{tr("challengesSub")}</div>
              <div className="mf-metrics">
                <div className="mf-metric"><div className="mf-macro-val">{earned}</div><div className="mf-macro-label">{tr("pointsEarned")}</div></div>
                <div className="mf-metric"><div className="mf-macro-val">{cl.filter((c) => c.done).length}/{cl.length}</div><div className="mf-macro-label">{tr("challengesDone")}</div></div>
              </div>
              {cl.map((c, i) => (
                <div key={i} className="mf-challenge-card" style={{ opacity: c.done ? 0.5 : 1 }}>
                  <div className="mf-challenge-icon">{c.icon}</div>
                  <div className="mf-challenge-info">
                    <div className="mf-challenge-title">{c.title}</div>
                    <div className="mf-challenge-sub">{c.sub}</div>
                  </div>
                  <div className="mf-challenge-pts">+{c.pts}</div>
                </div>
              ))}
            </>
          )}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(MondayFit));
</script>
</body>
</html>
