<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>monday Fitness — AI Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,#root{background:#080b0f;min-height:100vh;font-family:'Syne',sans-serif;color:#d4e8f7}
:root{--lime:#c8f135;--blue:#3b9eff;--s:#111820;--s2:#162030;--b:rgba(99,179,255,0.12);--b2:rgba(99,179,255,0.22);--m:#4a6278;--t:#d4e8f7;--t2:#8ab4cc}
.app{max-width:860px;margin:0 auto;padding:16px 16px 60px}
.hdr{display:flex;align-items:center;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--b);margin-bottom:20px}
.brand{font-size:17px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--lime)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--blue);background:rgba(59,158,255,0.12);border:1px solid rgba(59,158,255,0.25);border-radius:4px;padding:2px 7px;letter-spacing:.5px}
.ml{margin-left:auto}.hbtn{padding:6px 12px;border-radius:8px;border:1px solid var(--b2);background:transparent;color:var(--t2);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.hbtn:hover{color:var(--blue);border-color:var(--blue)}
.nav{display:flex;gap:3px;margin-bottom:20px;background:var(--s);border-radius:11px;padding:4px;border:1px solid var(--b)}
.nt{flex:1;padding:8px 6px;border-radius:8px;border:none;background:transparent;color:var(--m);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.nt.on{background:linear-gradient(135deg,var(--s2),#1a2d42);color:var(--t);box-shadow:0 0 0 1px var(--b2)}
.nt.coach.on{background:linear-gradient(135deg,rgba(200,241,53,.15),rgba(200,241,53,.05));color:var(--lime);box-shadow:0 0 0 1px rgba(200,241,53,.3)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--lime);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero{text-align:center;padding:28px 16px 24px}
.ey{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--blue);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.ht{font-size:clamp(24px,4vw,40px);font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin-bottom:12px}.ht span{color:var(--lime)}
.hs{font-size:13px;color:var(--t2);max-width:380px;margin:0 auto;line-height:1.6}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.ff{display:flex;flex-direction:column;gap:5px}.ff.full{grid-column:1/-1}
.fl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--blue);letter-spacing:1px;text-transform:uppercase}
.fi{width:100%;background:var(--s);border:1px solid var(--b);border-radius:9px;padding:10px 13px;color:var(--t);font-family:'Syne',sans-serif;font-size:14px;font-weight:500;outline:none}
.fi:focus{border-color:var(--blue)}
.cps{display:flex;flex-wrap:wrap;gap:7px}
.cp{padding:7px 13px;border-radius:30px;border:1.5px solid var(--b);background:transparent;color:var(--t2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.cp:hover{border-color:var(--b2)}.cp.on{border-color:var(--lime);background:rgba(200,241,53,.1);color:var(--lime)}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.lc{background:var(--s);border:1.5px solid var(--b);border-radius:13px;padding:13px 9px;cursor:pointer;text-align:center;transition:all .15s}
.lc:hover{border-color:var(--b2);transform:translateY(-1px)}.lc.on{border-color:var(--lime);background:rgba(200,241,53,.07)}
.cta{background:var(--lime);color:#0a0f14;border:none;border-radius:11px;padding:13px 26px;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:8px;transition:all .2s}
.cta:hover{opacity:.88;transform:translateY(-1px)}.cta:disabled{opacity:.3;cursor:not-allowed;transform:none}
.ph{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:18px 20px;margin-bottom:15px;position:relative;overflow:hidden}
.ph::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--lime),var(--blue),transparent)}
.pg{font-size:21px;font-weight:800;letter-spacing:-.5px;color:var(--lime)}
.pbs{display:flex;gap:7px;margin:8px 0 13px;flex-wrap:wrap}
.pb{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;background:var(--s2);color:var(--t2);border:1px solid var(--b)}
.pb.g{background:rgba(200,241,53,.1);color:var(--lime);border-color:rgba(200,241,53,.25)}
.bar{height:5px;background:var(--s2);border-radius:10px;overflow:hidden;margin-top:13px}
.barf{height:100%;background:linear-gradient(90deg,var(--lime),var(--blue));border-radius:10px;transition:width .5s}
.sts{display:flex;gap:7px;margin-bottom:15px;flex-wrap:wrap;align-items:center}
.st{padding:6px 13px;border-radius:30px;border:1.5px solid var(--b);background:transparent;color:var(--m);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.st.on{border-color:var(--blue);color:var(--blue);background:rgba(59,158,255,.1)}
.rb{padding:6px 10px;border-radius:7px;border:1px solid var(--b);background:transparent;color:var(--m);font-family:'Syne',sans-serif;font-size:11px;cursor:pointer;margin-left:auto}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dc{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:15px;position:relative;overflow:hidden;transition:border-color .15s}
.dc::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--b);transition:background .15s}
.dc:hover{border-color:var(--b2)}.dc:hover::before{background:var(--blue)}
.dc.dn{border-color:rgba(200,241,53,.3);background:rgba(200,241,53,.04)}.dc.dn::before{background:var(--lime)}
.dday{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.dfoc{font-size:14px;font-weight:700;margin-bottom:10px}
.dex{font-size:12px;color:var(--t2);display:flex;align-items:baseline;gap:6px;margin-bottom:5px}
.dex::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px;display:block}
.mb{margin-top:11px;padding:7px;border-radius:7px;border:1px solid var(--b);background:transparent;color:var(--m);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;width:100%;transition:all .15s}
.mb:hover{border-color:var(--lime);color:var(--lime)}.mb.on{background:rgba(200,241,53,.1);border-color:rgba(200,241,53,.35);color:var(--lime)}
.nmr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:11px 0 16px}
.nm{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:11px;text-align:center}
.nmv{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500;color:var(--lime)}
.nml{font-size:10px;color:var(--m);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.mi{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:11px}
.mico{width:37px;height:37px;border-radius:9px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.mti{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--blue);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.mn{font-size:13px;font-weight:600}
.atb{padding:4px 9px;border-radius:6px;border:1px solid var(--b);background:transparent;color:var(--m);font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer;transition:all .15s;white-space:nowrap}
.atb:hover,.atb.on{border-color:var(--lime);color:var(--lime);background:rgba(200,241,53,.07)}
.abox{margin-top:9px;padding:9px 11px;background:rgba(200,241,53,.05);border-radius:7px;border-left:2px solid var(--lime)}
.al{font-family:'JetBrains Mono',monospace;font-size:9px;color:#9ab82a;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.at{font-size:12px;color:var(--t2)}
.cw{display:flex;flex-direction:column;gap:11px}
.chdr{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:15px 17px;display:flex;align-items:center;gap:11px;position:relative;overflow:hidden}
.chdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--lime),var(--blue))}
.cav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(59,158,255,.2));border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;position:relative}
.cav::after{content:'';position:absolute;bottom:0;right:0;width:8px;height:8px;background:var(--lime);border:2px solid #080b0f;border-radius:50%}
.cn{font-size:14px;font-weight:800}.cs{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--lime);margin-top:1px;display:flex;align-items:center;gap:5px}
.qr{display:flex;flex-wrap:wrap;gap:6px}
.qc{padding:5px 10px;border-radius:16px;border:1px solid var(--b2);background:var(--s2);color:var(--t2);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.qc:hover{border-color:var(--lime);color:var(--lime)}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;padding:2px}
.msgs::-webkit-scrollbar{width:3px}.msgs::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.msg{display:flex;gap:8px;animation:fu .22s ease}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.u{flex-direction:row-reverse}
.mav{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.mav.ai{background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(59,158,255,.2));border:1px solid var(--b2)}
.mav.u{background:var(--s2);border:1px solid var(--b)}
.bub{max-width:78%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.bub.ai{background:var(--s);border:1px solid var(--b);border-radius:12px 12px 12px 3px;color:var(--t)}
.bub.u{background:linear-gradient(135deg,rgba(200,241,53,.15),rgba(59,158,255,.08));border:1px solid rgba(200,241,53,.2);border-radius:12px 12px 3px 12px;color:var(--t)}
.typing{display:flex;gap:4px;padding:11px 13px;background:var(--s);border:1px solid var(--b);border-radius:12px 12px 12px 3px;width:54px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:bnc 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bnc{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.ir{display:flex;gap:7px;background:var(--s);border:1px solid var(--b);border-radius:11px;padding:5px 5px 5px 13px;transition:border-color .2s}
.ir:focus-within{border-color:var(--b2)}
.ci{flex:1;background:transparent;border:none;outline:none;color:var(--t);font-family:'Syne',sans-serif;font-size:13px;font-weight:500;padding:7px 0}
.ci::placeholder{color:var(--m)}
.sb{background:var(--lime);color:#0a0f14;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:14px;font-weight:800;flex-shrink:0}
.sb:hover{transform:scale(1.05)}.sb:disabled{opacity:.3;cursor:not-allowed;transform:none}
.spin{width:36px;height:36px;border:2px solid var(--b);border-top-color:var(--lime);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.ls{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.los{display:flex;gap:12px}
.lo{padding:13px 26px;border-radius:13px;border:1.5px solid var(--b);background:var(--s);color:var(--t);font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.lo:hover{border-color:var(--lime);background:rgba(200,241,53,.07);transform:translateY(-2px)}
.lbn{font-size:12px;font-weight:500;color:var(--t2)}
.logo-img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 18px rgba(59,158,255,.3)}
</style>
</head>

    {en:"Roast chicken + lentil soup + bread",he:"עוף בתנור + מרק עדשים + לחם",alt:"Tuna pasta + corn"},
    {en:"Labneh + tahini + crackers",he:"לאבנה + טחינה + קרקרים",alt:"White cheese 9% + walnuts + date"}
  ]}
};
const T={
  en:{sub:"Answer a few questions — Claude builds your personalized plan.",lName:"Name",lAge:"Age",lWeight:"Weight (kg)",lHeight:"Height (cm)",lGoal:"Goal",goals:["Lose weight","Build muscle","Get fit","Bulk up","Endurance"],lLevel:"Level",levels:["Beginner","Intermediate","Advanced"],lLoc:"Where do you train?",locs:[{v:"home",e:"🏠",t:"Home",d:"Bodyweight"},{v:"outdoor",e:"🌳",t:"Park",d:"Pull-ups + run"},{v:"both",e:"🔀",t:"Mix",d:"Home + outdoor"}],genBtn:"Generate my program →",loadTtl:"AI Coach is building your plan...",tabs:["Workout","Nutrition","AI Coach"],mTimes:["Breakfast","Lunch","Snack","Dinner","Evening"],altBtn:"Alt",hideAlt:"Hide",altLbl:"🇮🇱 Israeli alt",markDone:"Mark complete",marked:"✓ Done",chips:["Only 20 min today","Knee hurts","Pre-workout meal?","Make it harder","Skipped yesterday"],redo:"← Restart",sw:"🇮🇱 עברית",cal:"Calories",pro:"Protein",carb:"Carbs",fat:"Fat",coachLive:"Online · Ready"},
  he:{sub:"ענה על כמה שאלות — קלוד בונה תוכנית אישית עבורך.",lName:"שם",lAge:"גיל",lWeight:'משקל (ק"ג)',lHeight:'גובה (ס"מ)',lGoal:"מטרה",goals:["ירידה במשקל","בניית שריר","כושר ואנרגיה","הגדלת מסה","סיבולת"],lLevel:"רמה",levels:["מתחיל","בינוני","מתקדם"],lLoc:"איפה מתאמנים?",locs:[{v:"home",e:"🏠",t:"בית",d:"משקל גוף"},{v:"outdoor",e:"🌳",t:"גינה",d:"מתח + ריצה"},{v:"both",e:"🔀",t:"שילוב",d:"בית + גינה"}],genBtn:"צור את התוכנית שלי ←",loadTtl:"ה-AI Coach בונה את התוכנית...",tabs:["אימונים","תזונה","AI Coach"],mTimes:["ארוחת בוקר","ארוחת צהריים","חטיף","ארוחת ערב","נשנוש"],altBtn:"חלופה",hideAlt:"הסתר",altLbl:"חלופה ישראלית",markDone:"סמן כהושלם",marked:"✓ הושלם",chips:["רק 20 דקות היום","הברך כואבת","מה לאכול לפני אימון?","תקשה","פספסתי אתמול"],redo:"← התחל מחדש",sw:"🇬🇧 English",cal:"קלוריות",pro:"חלבון",carb:"פחמימות",fat:"שומן",coachLive:"מחובר · מוכן"}
};

function App(){
  const[lang,setLang]=useState(null);
  const[tab,setTab]=useState("w");
  const[prof,setProf]=useState({name:"",age:"",weight:"",height:"",goal:"",level:"",loc:""});
  const[gen,setGen]=useState(false);
  const[plan,setPlan]=useState(null);
  const[greet,setGreet]=useState("");
  const[comp,setComp]=useState({});
  const[alts,setAlts]=useState({});
  const[msgs,setMsgs]=useState([]);
  const[ci,setCi]=useState("");
  const[cload,setCload]=useState(false);
  const[hist,setHist]=useState([]);
  const msgsRef=useRef(null);
  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[msgs]);
  const tr=k=>T[lang||"en"][k];
  const isHe=lang==="he";
  const upd=(k,v)=>setProf(p=>({...p,[k]:v}));
  const ok=()=>prof.name&&prof.age&&prof.weight&&prof.height&&prof.goal&&prof.level&&prof.loc;
  const gk=()=>{const g=prof.goal||"";if(g.includes("Lose")||g.includes("ירידה"))return"cut";if(g.includes("Bulk")||g.includes("Build")||g.includes("מסה")||g.includes("שריר"))return"bulk";return"maintain";};
  const done=Object.values(comp).filter(Boolean).length;
  const total=plan?plan.length:7;
  const pct=total?Math.round(done/total*100):0;
  const markD=i=>setComp(c=>({...c,[i]:!c[i]}));
  const reset=()=>{setProf({name:"",age:"",weight:"",height:"",goal:"",level:"",loc:""});setPlan(null);setGreet("");setComp({});setAlts({});setMsgs([]);setHist([]);setTab("w");};

  const genPlan=async()=>{
    if(!ok())return;setGen(true);
    const lm={home:isHe?"בית (משקל גוף בלבד)":"home (bodyweight only — no equipment)",outdoor:isHe?"גינה":"outdoor park with pull-up bars and parallel bars",both:isHe?"שילוב":"mix of home and outdoor"};
    const pr=`Build a 7-day fitness plan. Return ONLY valid JSON:\n{"greeting":"2 sentences in ${isHe?"Hebrew":"English"}","days":[{"day":"Mon","focus":"name in ${isHe?"Hebrew":"English"}","exercises":["exercise 3x12","exercise 3x12","exercise 3x30s"]}]}\nProfile: ${prof.name}, age ${prof.age}, ${prof.weight}kg, ${prof.height}cm, goal:${prof.goal}, level:${prof.level}, training:${lm[prof.loc]}.\nRules: exactly 7 days Mon-Sun. ${prof.loc==="home"?"HOME ONLY — push-ups squats lunges plank burpees chair-dips mountain-climbers — zero gym equipment":""}${prof.loc==="outdoor"?"OUTDOOR — pull-ups parallel-bars stairs running":""}. Rest days max 2 items. No markdown, JSON only.`;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:pr}]})});
      const d=await r.json();
      const txt=d.content[0].text.replace(/```json|```/g,"").trim();
      const p=JSON.parse(txt);
      setPlan(p.days||[]);setGreet(p.greeting||"");
      const w=isHe?`היי ${prof.name}! 👋 בניתי את התוכנית האישית שלך. שאל אותי כל שאלה — שנה תרגילים, תאם ארוחות, ספר לי איך אתה מרגיש.`:`Hi ${prof.name}! 👋 I've built your personalized program. Ask me anything — swap exercises, adjust meals, or tell me how you feel today.`;
      setMsgs([{r:"ai",c:w}]);setHist([{role:"assistant",content:w}]);
      setGen(false);
    }catch(e){setGen(false);alert("Error generating plan — check your internet connection.");}
  };

  const sendChat=async(txt2)=>{
    const text=(txt2||ci).trim();if(!text||cload)return;
    setCi("");setMsgs(m=>[...m,{r:"user",c:text}]);
    const nh=[...hist,{role:"user",content:text}];setHist(nh);setCload(true);
    const sys=`You are an expert AI fitness coach for monday.com. User: ${prof.name}, age ${prof.age}, ${prof.weight}kg, goal: ${prof.goal}, level: ${prof.level}, trains: ${prof.loc}. Reply in ${isHe?"Hebrew":"English"}. Direct, specific, max 4 sentences. For home: bodyweight only. Suggest Israeli foods when relevant (cottage, white cheese, eggs, pita, tahini).`;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,stream:true,system:sys,messages:nh})});
      const reader=r.body.getReader();const dec=new TextDecoder();let at="";
      setMsgs(m=>[...m,{r:"ai",c:"",streaming:true}]);
      while(true){const{done,value}=await reader.read();if(done)break;
        for(const line of dec.decode(value).split("\n").filter(l=>l.startsWith("data:"))){
          const d=line.slice(5).trim();if(d==="[DONE]")continue;
          try{const j=JSON.parse(d);if(j.type==="content_block_delta"&&j.delta?.text){at+=j.delta.text;setMsgs(m=>[...m.slice(0,-1),{r:"ai",c:at}]);}}catch(_){}
        }
      }
      setHist(h=>[...h,{role:"assistant",content:at}]);
    }catch(_){setMsgs(m=>[...m.slice(0,-1),{r:"ai",c:"Sorry, connection error. Try again."}]);}
    setCload(false);
  };

  const nut=NUT[gk()];
  const bmi=prof.weight&&prof.height?(parseFloat(prof.weight)/Math.pow(parseFloat(prof.height)/100,2)).toFixed(1):"—";
  const locOpts=tr("locs");
  const ICONS=["🌅","☀️","🥤","🌙","🌙"];

  if(!lang)return(
    <div className="app"><div className="ls">
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <img src={LOGO} className="logo-img" alt="monday"/>
        <div style={{fontSize:24,fontWeight:800,letterSpacing:"-1px"}}>monday <span style={{color:"var(--lime)"}}>Fitness</span></div>
      </div>
      <div style={{fontSize:13,color:"var(--t2)"}}>AI-powered fitness coach · מאמן כושר מבוסס AI</div>
      <div className="los">
        <button className="lo" onClick={()=>setLang("en")}><span style={{fontSize:26}}>🇬🇧</span><span className="lbn">English</span></button>
        <button className="lo" onClick={()=>setLang("he")}><span style={{fontSize:26}}>🇮🇱</span><span className="lbn">עברית</span></button>
      </div>
    </div></div>
  );

  return(
    <div className="app" dir={isHe?"rtl":"ltr"}>
      <div className="hdr">
        <img src={LOGO} className="logo-img" alt="monday"/>
        <div className="brand">monday <span>Fitness</span></div>
        <span className="tag">AI COACH</span>
        <div className="ml" style={{display:"flex",gap:8}}>
          {plan&&<button className="hbtn" onClick={reset}>{tr("redo")}</button>}
          <button className="hbtn" onClick={()=>setLang(l=>l==="en"?"he":"en")}>{tr("sw")}</button>
        </div>
      </div>

      {!gen&&!plan&&<>
        <div className="hero">
          <div className="ey">monday fitness · ai powered</div>
          <h1 className="ht">Meet your <span>AI Coach</span></h1>
          <p className="hs">{tr("sub")}</p>
        </div>
        <div className="fg">
          <div className="ff"><div className="fl">{tr("lName")}</div><input className="fi" placeholder="e.g. Yael" value={prof.name} onChange={e=>upd("name",e.target.value)}/></div>
          <div className="ff"><div className="fl">{tr("lAge")}</div><input className="fi" type="number" placeholder="30" value={prof.age} onChange={e=>upd("age",e.target.value)}/></div>
          <div className="ff"><div className="fl">{tr("lWeight")}</div><input className="fi" type="number" placeholder="72" value={prof.weight} onChange={e=>upd("weight",e.target.value)}/></div>
          <div className="ff"><div className="fl">{tr("lHeight")}</div><input className="fi" type="number" placeholder="175" value={prof.height} onChange={e=>upd("height",e.target.value)}/></div>
          <div className="ff full"><div className="fl">{tr("lGoal")}</div><div className="cps">{tr("goals").map(o=><button key={o} className={"cp"+(prof.goal===o?" on":"")} onClick={()=>upd("goal",o)}>{o}</button>)}</div></div>
          <div className="ff full"><div className="fl">{tr("lLevel")}</div><div className="cps">{tr("levels").map(o=><button key={o} className={"cp"+(prof.level===o?" on":"")} onClick={()=>upd("level",o)}>{o}</button>)}</div></div>
          <div className="ff full">
            <div className="fl">{tr("lLoc")}</div>
            <div className="lg">{locOpts.map(o=><div key={o.v} className={"lc"+(prof.loc===o.v?" on":"")} onClick={()=>upd("loc",o.v)}><div style={{fontSize:22,marginBottom:5}}>{o.e}</div><div style={{fontSize:13,fontWeight:700}}>{o.t}</div><div style={{fontSize:11,color:"var(--m)",marginTop:3}}>{o.d}</div></div>)}</div>
          </div>
        </div>
        <button className="cta" onClick={genPlan} disabled={!ok()}>{tr("genBtn")}</button>
      </>}

      {gen&&<div style={{textAlign:"center",padding:"60px 20px"}}>
        <div className="spin"/>
        <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>{tr("loadTtl")}</div>
        <div style={{fontSize:12,color:"var(--t2)"}}>Analyzing · Designing · Calibrating</div>
      </div>}

      {plan&&<>
        <div className="ph">
          <div style={{fontSize:12,color:"var(--m)",marginBottom:4,fontFamily:"'JetBrains Mono',monospace"}}>HEY {prof.name.toUpperCase()} 👋</div>
          <div className="pg">{prof.goal}</div>
          <div className="pbs">
            <span className="pb">{prof.level}</span>
            <span className="pb">BMI {bmi}</span>
            <span className="pb">{locOpts.find(l=>l.v===prof.loc)?.e} {locOpts.find(l=>l.v===prof.loc)?.t}</span>
            <span className="pb g">{done}/{total} {isHe?"הושלמו":"done"}</span>
          </div>
          {greet&&<div style={{fontSize:12,color:"var(--t2)",lineHeight:1.65,marginBottom:12,fontStyle:"italic"}}>{greet}</div>}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="bar" style={{flex:1}}><div className="barf" style={{width:pct+"%"}}/></div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"var(--lime)",minWidth:30}}>{pct}%</div>
          </div>
        </div>

        <div className="nav">
          {[["w","🏋️ "+(tr("tabs")[0])],["n","🥗 "+(tr("tabs")[1])],["c","🤖 "+(tr("tabs")[2])]].map(([k,lbl])=>
            <button key={k} className={`nt${k==="c"?" coach":""}${tab===k?" on":""}`} onClick={()=>setTab(k)}>
              {k==="c"&&<span className="dot"/>}{lbl}
            </button>
          )}
        </div>

        {tab==="w"&&<div className="dg">{plan.map((d,i)=>{const isDone=comp[i];return(
          <div key={i} className={"dc"+(isDone?" dn":"")}>
            <div className="dday">{d.day}</div>
            <div className="dfoc">{d.focus}</div>
            <div>{(d.exercises||[]).map((ex,j)=><div key={j} className="dex">{ex}</div>)}</div>
            <button className={"mb"+(isDone?" on":"")} onClick={()=>markD(i)}>{isDone?tr("marked"):tr("markDone")}</button>
          </div>
        );})}</div>}

        {tab==="n"&&<>
          <div className="nmr">
            {[{v:nut.cal,l:tr("cal")},{v:nut.p+"g",l:tr("pro")},{v:nut.c+"g",l:tr("carb")},{v:nut.f+"g",l:tr("fat")}].map(m=>
              <div key={m.l} className="nm"><div className="nmv">{m.v}</div><div className="nml">{m.l}</div></div>
            )}
          </div>
          {nut.meals.map((m,i)=>(
            <div key={i} className="mi">
              <div className="mico">{ICONS[i]}</div>
              <div style={{flex:1}}>
                <div className="mti">{tr("mTimes")[i]}</div>
                <div className="mn">{isHe?m.he:m.en}</div>
                {alts[i]&&<div className="abox"><div className="al">{tr("altLbl")}</div><div className="at">{m.alt}</div></div>}
              </div>
              <button className={"atb"+(alts[i]?" on":"")} onClick={()=>setAlts(a=>({...a,[i]:!a[i]}))}>{alts[i]?tr("hideAlt"):tr("altBtn")}</button>
            </div>
          ))}
        </>}

        {tab==="c"&&<div className="cw">
          <div className="chdr">
            <div className="cav">🤖</div>
            <div><div className="cn">monday AI Coach</div><div className="cs"><span className="dot"/>{tr("coachLive")}</div></div>
          </div>
          <div className="qr">{tr("chips").map((q,i)=><button key={i} className="qc" onClick={()=>sendChat(q)}>{q}</button>)}</div>
          <div className="msgs" ref={msgsRef}>
            {msgs.map((m,i)=>(
              <div key={i} className={"msg"+(m.r==="user"?" u":"")}>
                <div className={"mav"+(m.r==="ai"?" ai":" u")}>{m.r==="ai"?"🤖":"👤"}</div>
                <div className={"bub"+(m.r==="ai"?" ai":" u")}>{m.c}</div>
              </div>
            ))}
            {cload&&<div className="msg"><div className="mav ai">🤖</div><div className="typing"><span/><span/><span/></div></div>}
          </div>
          <div className="ir">
            <input className="ci" placeholder={isHe?"שאל את המאמן שלך...":"Ask your coach anything..."} value={ci} onChange={e=>setCi(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendChat()}/>
            <button className="sb" onClick={()=>sendChat()} disabled={!ci.trim()||cload}>↑</button>
          </div>
        </div>}
      </>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
